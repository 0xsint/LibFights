<title>LibFights API Reference</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: fixed sidebar of sections + one reading column; each function is a row with its signature,
   a plain-language line, and a "returns" ledger listing every outcome. */
:root {
  --bg: #f5f7f9;
  --surface: #ffffff;
  --ink: #18212b;
  --muted: #5b6876;
  --line: #dde3ea;
  --accent: #1f6f78;        /* deep teal, used for signatures and links */
  --accent-soft: #e2f0f1;
  --gold: #9a6b12;          /* return values */
  --gold-soft: #f8efdc;
  --red: #a63d3d;           /* false / nil / failure cases */
  --red-soft: #f7e6e6;
  --code-bg: #eef2f5;
  --display: "Cinzel", "Trajan Pro", Georgia, serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --side: 260px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161c; --surface: #171e26; --ink: #e3e8ee; --muted: #93a0ad; --line: #2a3440;
    --accent: #5fc2cb; --accent-soft: #173238; --gold: #e2b65a; --gold-soft: #2e2615;
    --red: #e58b8b; --red-soft: #3a1f22; --code-bg: #1d2630; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161c; --surface: #171e26; --ink: #e3e8ee; --muted: #93a0ad; --line: #2a3440;
  --accent: #5fc2cb; --accent-soft: #173238; --gold: #e2b65a; --gold-soft: #2e2615;
  --red: #e58b8b; --red-soft: #3a1f22; --code-bg: #1d2630; color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--accent); }
code, .mono { font-family: var(--mono); font-size: 0.88em; }
:not(pre) > code { background: var(--code-bg); padding: 0.08em 0.35em; border-radius: 4px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.shell { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); min-height: 100vh; }

/* sidebar */
.side {
  position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto;
  border-right: 1px solid var(--line); background: var(--surface);
  padding-block: 22px 32px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: 18px;
  display: flex; flex-direction: column; gap: 18px;
}
.brand { font-family: var(--display); font-weight: 700; font-size: 22px; letter-spacing: 0.04em; line-height: 1.1; }
.brand small { display: block; font-family: var(--body); font-weight: 500; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-top: 6px; }
.search { position: relative; }
.search input {
  width: 100%; font: inherit; font-size: 14px; padding: 9px 12px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--bg); color: var(--ink);
}
.search input::placeholder { color: var(--muted); }
.search-count { font-size: 12px; color: var(--muted); margin-top: 6px; min-height: 1.2em; }
.toc { display: flex; flex-direction: column; gap: 1px; }
.toc a {
  display: flex; justify-content: space-between; gap: 8px; text-decoration: none; color: var(--ink);
  font-size: 14px; padding: 5px 9px; border-radius: 6px;
}
.toc a:hover { background: var(--accent-soft); }
.toc a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.toc a .n { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.toc a.dim { opacity: 0.35; }
.toc .group { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 12px 9px 4px; }

/* main column */
main { padding-block: 40px 96px; padding-left: max(16px, 48px); padding-right: max(16px, env(safe-area-inset-right, 0px), 48px); min-width: 0; }
.wrap { max-width: 860px; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(30px, 5vw, 42px); letter-spacing: 0.03em; line-height: 1.1; margin: 0 0 10px; text-wrap: balance; }
.lede { font-size: 17px; color: var(--muted); max-width: 62ch; margin: 0 0 28px; }
.rule-box {
  border: 1px solid var(--line); border-left: 4px solid var(--red); background: var(--surface);
  padding: 14px 18px; border-radius: 8px; margin-bottom: 28px;
}
.rule-box strong { color: var(--red); }

section.sec { padding-top: 34px; scroll-margin-top: 16px; }
section.sec > header { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 14px; border-bottom: 1px solid var(--line); padding-bottom: 10px; margin-bottom: 8px; }
h2 { font-family: var(--display); font-weight: 600; font-size: 24px; letter-spacing: 0.03em; margin: 0; text-wrap: balance; }
.ns { font-family: var(--mono); font-size: 13px; color: var(--accent); background: var(--accent-soft); padding: 2px 8px; border-radius: 5px; }
.intro { color: var(--muted); max-width: 68ch; margin: 10px 0 6px; }
h3.sub { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin: 26px 0 4px; }

/* function entry */
.fn { padding: 18px 0; border-bottom: 1px solid var(--line); scroll-margin-top: 16px; }
.fn:last-child { border-bottom: 0; }
.sig { font-family: var(--mono); font-weight: 600; font-size: 15px; color: var(--accent); word-break: break-word; }
.sig .opt { color: var(--muted); font-weight: 400; }
.alias { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.desc { margin: 6px 0 0; max-width: 70ch; }
.params { margin: 10px 0 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; font-size: 14px; }
.params dt { font-family: var(--mono); font-size: 13px; color: var(--ink); font-weight: 500; }
.params dd { margin: 0; color: var(--muted); min-width: 0; }
.ret { margin-top: 12px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.ret-row { display: grid; grid-template-columns: minmax(130px, 38%) minmax(0, 1fr); border-top: 1px solid var(--line); }
.ret-row:first-child { border-top: 0; }
.ret-val { font-family: var(--mono); font-size: 13px; padding: 8px 12px; background: var(--gold-soft); color: var(--gold); font-weight: 500; word-break: break-word; }
.ret-val.bad { background: var(--red-soft); color: var(--red); }
.ret-when { padding: 8px 12px; font-size: 14px; min-width: 0; }
.ret-when .k { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); display: block; }
.note { font-size: 13.5px; color: var(--muted); margin-top: 8px; max-width: 70ch; }

/* compact list (one-line functions) */
.compact { margin-top: 6px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.crow { display: grid; grid-template-columns: minmax(0, 44%) minmax(0, 22%) minmax(0, 1fr); gap: 12px; padding: 9px 14px; border-top: 1px solid var(--line); align-items: baseline; }
.crow:first-child { border-top: 0; }
.crow .sig { font-size: 13.5px; }
.crow .rv { font-family: var(--mono); font-size: 12.5px; color: var(--gold); }
.crow .rv.bad { color: var(--red); }
.crow .tx { font-size: 14px; color: var(--muted); }

/* field tables (data structures) */
.fields { margin-top: 10px; overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--bg); }
td { padding: 7px 12px; border-top: 1px solid var(--line); vertical-align: top; }
tr:first-child td { border-top: 0; }
td.f { font-family: var(--mono); font-size: 13px; color: var(--accent); width: 34%; word-break: break-word; }
td.grp { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); background: var(--bg); font-weight: 600; }
.struct { padding: 18px 0; border-bottom: 1px solid var(--line); scroll-margin-top: 16px; }
.struct h4 { margin: 0; font-size: 17px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.struct h4 .from { font-weight: 400; font-size: 13px; color: var(--muted); }

/* code samples */
pre { margin: 10px 0 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; overflow-x: auto; font-family: var(--mono); font-size: 13px; line-height: 1.55; }
pre .c { color: var(--muted); }
pre .s { color: var(--gold); }
pre .k { color: var(--accent); font-weight: 600; }
.qs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-top: 12px; }
.qs > div { min-width: 0; }
.qs h4 { margin: 0; font-size: 15px; }
.qs p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.conv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; margin-top: 12px; font-size: 14px; }
.conv dt { font-family: var(--mono); font-size: 13px; font-weight: 600; }
.conv dd { margin: 0; color: var(--muted); }
.chip { display: inline-block; font-family: var(--mono); font-size: 12px; padding: 1px 7px; border-radius: 99px; background: var(--gold-soft); color: var(--gold); }
.chip.bad { background: var(--red-soft); color: var(--red); }

/* add-on examples */
.ex-index { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 4px; }
.ex-index a { font-size: 13px; text-decoration: none; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.ex-index a:hover { border-color: var(--accent); color: var(--accent); }
.ex { padding: 22px 0; border-bottom: 1px solid var(--line); scroll-margin-top: 16px; }
.ex:last-child { border-bottom: 0; }
.ex-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; }
.ex-head h3 { margin: 0; font-size: 18px; }
.tag { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; padding: 2px 8px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); }
.tag.pc { background: var(--gold-soft); color: var(--gold); }
.ex-desc { margin: 6px 0 0; max-width: 70ch; }
.uses { display: flex; flex-wrap: wrap; align-items: baseline; gap: 5px; margin-top: 10px; font-size: 12px; }
.uses > span { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-right: 4px; }
.uses code { font-size: 12px; }
.file { margin-top: 12px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--code-bg); }
.file pre { margin: 0; border: 0; border-radius: 0; }
.file-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 8px 6px 14px; border-bottom: 1px solid var(--line); background: var(--surface); }
.fname { font-family: var(--mono); font-size: 12.5px; color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
.copy { font: inherit; font-size: 12.5px; font-weight: 500; padding: 4px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; flex-shrink: 0; }
.copy:hover { border-color: var(--accent); color: var(--accent); }
.copy.done { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.ex-note { font-size: 13.5px; color: var(--muted); margin: 10px 0 0; max-width: 70ch; }

mark { background: var(--gold-soft); color: inherit; border-radius: 3px; padding: 0 1px; box-shadow: 0 0 0 1px var(--gold); }
.empty { padding: 40px 0; color: var(--muted); }

/* phones */
.menu-btn { display: none; }
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .toc { display: none; }
  .side.open .toc { display: flex; }
  .menu-btn { display: inline-flex; font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); cursor: pointer; align-self: flex-start; }
  main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 64px; }
  .qs { grid-template-columns: minmax(0, 1fr); }
  .crow { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .ret-row { grid-template-columns: minmax(0, 1fr); }
  .params { grid-template-columns: minmax(0, 1fr); gap: 0 0; }
  .params dd { margin-bottom: 6px; }
  td.f { width: 40%; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<div class="shell">
  <aside class="side" id="side">
    <div class="brand">LibFights<small>API reference · v1.0.0</small></div>
    <div class="search">
      <input id="q" type="search" placeholder="Search functions and fields…" autocomplete="off" aria-label="Search the API">
      <div class="search-count" id="count"></div>
    </div>
    <button class="menu-btn" id="menuBtn" type="button" aria-expanded="false">Sections</button>
    <nav class="toc" id="toc"></nav>
  </aside>

  <main>
    <div class="wrap" id="content"></div>
  </main>
</div>

<script>
// ---------------------------------------------------------------------------
// Content. fn(signature, description, returns, extras)
//   returns: [[value, when], ...]   value starting with false/nil/"" is shown as a failure case
//   extras:  { alias, params: [[name, text]], note }
// row(signature, returns, text) is a one-line entry for the compact lists.
// ---------------------------------------------------------------------------
const fn = (sig, desc, ret, x = {}) => ({ t: "fn", sig, desc, ret, ...x });
const row = (sig, rv, tx) => ({ t: "row", sig, rv, tx });
const sub = (title) => ({ t: "sub", title });
const tbl = (cols, rows, title) => ({ t: "tbl", cols, rows, title });
const st = (name, from, rows, note) => ({ t: "struct", name, from, rows, note });
const prose = (html) => ({ t: "prose", html });

const SECTIONS = [
{ id: "start", group: "Start here", title: "Quick start", items: [], special: "quick" },
{ id: "conventions", group: "Start here", title: "How to read this", items: [], special: "conv" },
{ id: "examples", group: "Start here", title: "Add-on examples", items: [], special: "examples" },

{ id: "logging", group: "Recording", title: "Logging", ns: "global", intro: "Nothing is recorded until you call `Start_Logging()`. These are the only functions that turn recording on or off.", items: [
  fn("Start_Logging(options?)", "Starts recording. Registers all combat events. If you are already in combat, a fight begins immediately.",
     [["true", "Logging started."], ["false, \"already logging\"", "Logging was already running."]],
     { alias: "Also LF.Start_Logging, LF.StartLogging", params: [["options", "Optional table. Overrides your saved settings for this session only: `rawEvents`, `rawEventCap`, `groupMode`, `trackTargetEffects`, `trackPower`, `trackCasts`, `statSampleMs`, `combatEndGraceMs`, `fightTimeoutMs`, `minFightSeconds`, `modelsEnabled`, `saveFights`, `buildDetail`."]] }),
  fn("Stop_Logging()", "Ends the current fight and unregisters every event.",
     [["true, fight", "Stopped. `fight` is the fight that just ended, or nil if there was none or it was too short to keep."], ["false, \"not logging\"", "Logging was not running."]],
     { alias: "Also LF.Stop_Logging, LF.StopLogging" }),
  fn("Is_Logging()", "Tells you whether recording is on.", [["boolean", "true while logging."]], { alias: "Also LF.Is_Logging, LF.IsLogging" }),
  fn("LF.SplitFight()", "Ends the current fight and starts a new one right away. Useful for boss phases.",
     [["true", "Split done."], ["false", "Not logging."]], { alias: "Also LF.Logger.SplitFight()" }),
  fn("LF.Logger.EndCurrentFight()", "Ends the running fight without stopping logging.",
     [["true", "A fight was ended and kept."], ["false", "No fight was running, or it was discarded (too short or empty)."]]),
  row("LF.Logger.ClearFights()", "nothing", "Forgets every fight held in memory this session."),
  row("LF.Logger.GetRegisteredEvents()", "array of strings", "Namespaces of the registered events. Empty when not logging."),
]},

{ id: "fights", group: "Recording", title: "Reading fights", ns: "LF.*", intro: "Fights live in memory for the session and, if `saveFights` is on, in SavedVariables. Each one is a Fight object (see Fight methods).", items: [
  fn("LF.GetCurrentFight()", "The fight that is running right now.", [["Fight", "A fight is running."], ["nil", "No fight is running."]], { alias: "Also LF.Logger.GetCurrentFight()" }),
  fn("LF.GetLastFight()", "The running fight, or if none, the newest finished one.", [["Fight", "Running or newest finished fight."], ["nil", "No fights yet."]], { alias: "Also LF.Logger.GetLastFight()" }),
  fn("LF.Logger.GetLastFinishedFight()", "The newest finished fight in memory.", [["Fight", "Found."], ["nil", "None finished yet."]]),
  fn("LF.GetFights()", "Every finished fight this session.", [["array of Fight", "Oldest first. Capped by the `maxFightsInMemory` setting."]], { alias: "Also LF.Logger.GetFights()" }),
  fn("LF.GetFight(id)", "Finds one fight by its number. Looks in memory, then the running fight, then SavedVariables.", [["Fight", "Found."], ["nil", "No fight with that id."]], { params: [["id", "number"]] }),
  fn("LF.GetSavedFights()", "Fights restored from SavedVariables.", [["array of Fight", "Can be empty."]], { alias: "Also LF.Storage.GetSavedFights()" }),
  fn("LF.QueryFights(filter?)", "Finds fights by zone, title, DPS and more. See Search and queries.", [["array of Fight", "Matches, memory first then saved."]]),
]},

{ id: "callbacks", group: "Recording", title: "Callbacks", ns: "LF.*", intro: "Get told when something happens instead of polling. Callbacks only fire while logging, and only when at least one listener is registered.", items: [
  fn("LF.RegisterCallback(eventName, callback, arg?)", "Adds a listener. Use the names in `LF.EVENTS`.",
     [["true", "Registered."], ["false", "eventName is not a string or callback is not a function."]]),
  row("LF.UnregisterCallback(eventName, callback)", "nothing", "Removes a listener."),
  row("LF.HasListeners(eventName)", "boolean", "true if anything is listening."),
  row("LF.FireCallback(eventName, ...)", "nothing", "Fires an event. Does nothing when no one listens."),
  tbl(["Event (LF.EVENTS.*)", "Your callback receives", "Notes"], [
    ["INITIALIZED", "()", "The library finished loading."],
    ["LOGGING_STARTED", "(options)", "The options table passed to Start_Logging (may be empty)."],
    ["LOGGING_STOPPED", "()", ""],
    ["FIGHT_STARTED", "(fight)", ""],
    ["FIGHT_ENDED", "(fight, reason)", "reason: \"combatEnd\", \"timeout\", \"stopped\", \"split\", \"zone\", \"manual\". Not fired for discarded fights."],
    ["COMBAT_EVENT", "(fight, direction, category, result, abilityId, hitValue, overflow, sourceUnitId, targetUnitId, damageType)", "direction: 1 out, 2 in, 3 self (LF.Fight.DIR). category: see Constants."],
    ["EFFECT_CHANGED", "(fight, scope, changeType, abilityId, effectName, unitId, stackCount)", "scope: \"player\" or \"target\"."],
    ["PROC", "(fight, procEntry)", "See ProcEntry."],
    ["DEATH", "(fight, deathEntry)", "See DeathEntry."],
    ["CAST", "(fight, slotIndex, abilityId, kind)", "kind: \"light\", \"heavy\", \"skill\", \"ultimate\", \"other\"."],
    ["BAR_SWAP", "(fight, activeWeaponPair)", "1 = front bar, 2 = back bar."],
    ["STATS_SAMPLE", "(fight, statSnapshot)", "See StatSnapshot."],
    ["GEAR_CHANGED", "(fight or nil, slotIndex)", ""],
    ["SCAN_PROGRESS", "(scanProgress)", "See ScanProgress."],
    ["SCAN_DONE", "(scanProgress)", ""],
  ], "Events"),
]},

{ id: "fight", group: "Fight data", title: "Fight methods", ns: "f:Method()", intro: "Call these on a Fight object, for example `local f = LibFights.GetLastFight()`. Rates divide by the fight duration. Pass `useActive = true` to divide by the time from your first to your last hit instead.", items: [
  sub("Duration"),
  row("f:GetDurationMs()", "number", "Length in ms (at least 1). A live fight counts up to now."),
  row("f:GetDurationSec()", "number", "Length in seconds (at least 1)."),
  row("f:GetActiveSec()", "number", "Seconds from your first to your last hit or heal."),
  row("f:IsActive()", "boolean", "true while the fight is running."),
  row("f:GetTitle()", "string", "Boss name, else the most-damaged target, else the zone, else \"Fight <id>\"."),
  sub("Damage and healing"),
  row("f:GetDPS(useActive?)", "number", "Damage done per second."),
  row("f:GetDPM(useActive?)", "number", "Damage done per minute."),
  row("f:GetBossDPS(useActive?)", "number", "Damage to bosses per second."),
  row("f:GetHPS(useActive?)", "number", "Effective healing per second (overheal excluded)."),
  row("f:GetHPM(useActive?)", "number", "Effective healing per minute."),
  row("f:GetRawHPS(useActive?)", "number", "Healing including overheal, per second."),
  row("f:GetDTPS()", "number", "Damage taken per second."),
  row("f:GetDTPM()", "number", "Damage taken per minute."),
  row("f:GetHTPS()", "number", "Healing received per second."),
  row("f:GetHTPM()", "number", "Healing received per minute."),
  sub("Mitigation"),
  row("f:GetMPS()", "number", "Damage mitigated per second."),
  row("f:GetMPM()", "number", "Damage mitigated per minute."),
  row("f:GetTotalMitigated()", "number", "Shield (exact) + block, armor and avoidance (estimates)."),
  sub("Shields"),
  row("f:GetTotalShield()", "number", "Damage absorbed by shields on you. Exact."),
  row("f:GetSPS()", "number", "Shield absorbed per second."),
  row("f:GetSPM()", "number", "Shield absorbed per minute."),
  row("f:GetTotalShieldGained()", "number", "Shield applied to you, from the game's shield bar. Includes shield that ran out unused. 0 if the client has no shield-bar events."),
  row("f:GetShieldGainedPS()", "number", "Shield applied per second."),
  row("f:GetShieldGainedPM()", "number", "Shield applied per minute."),

{ id: "search", group: "Fight data", title: "Search and queries", ns: "LF.*", intro: "One search box for everything: abilities, sets, fights, effects, procs, targets, stats, casts and raw events.", items: [
  fn("LF.Search(query, opts?)", "Searches everything at once.", [["array of SearchResult", "{ kind, id, name, icon, detail, data }. kind is \"ability\", \"set\", \"stat\", \"fight\", \"target\", \"fightAbility\", \"effect\", \"proc\", \"cast\" or \"event\". data is the underlying table."]],
     { params: [["query", "Free text plus optional filters: `in:ability` `in:set` `in:fight` `in:effect` `in:proc` `in:target` `in:stat` `in:cast` `in:event` (several allowed; events need `in:event`), `id:12345` for an exact id, `fight:7` to search inside fight 7."], ["opts.limit", "Default 50."], ["opts.fight", "Fight to search inside. Default: current or last fight."]] }),
  row("LF.SearchFormatResult(result)", "string", "\"[kind] icon name (id) detail\". Also LF.Search_.FormatResult."),
  row("LF.Search_.Parse(query)", "table", "{ terms, filters, kinds, text, ltext }: how a query string is understood."),
  fn("LF.FindEvents(fight?, filter?)", "Filters raw events.", [["array of DecodedEvent", "Matches."], ["{}", "No fight, or raw logging was off."]],
     { params: [["fight", "Default: last fight."], ["filter", "All optional: `direction` (\"out\" \"in\" \"self\" \"group\"), `category`, `result`, `abilityId`, `abilityName`, `source`, `target` (substrings), `sourceUnitId`, `targetUnitId`, `damageType`, `crit` (true/false), `minHit`, `maxHit`, `fromMs`, `toMs` (from fight start), `limit` (default 200), `newestFirst`."]] }),
  fn("LF.NewQuery(fight?)", "A chainable query over raw events. Every setter returns the same query, so you can chain them.", [["Query", "Chain setters, then finish with :Run(), :Count(), :Sum() or :Max()."]],
     { params: [["Setters", "`:Direction(d)` `:Category(c)` `:Result(r)` `:Ability(id)` `:AbilityName(s)` `:Source(s)` `:Target(s)` `:DamageType(dt)` `:Crit(bool)` `:MinHit(n)` `:MaxHit(n)` `:From(ms)` `:To(ms)` `:Limit(n)` `:NewestFirst()`"], [":Run()", "array of DecodedEvent"], [":Count()", "number"], [":Sum()", "number, sum of hit values"], [":Max()", "DecodedEvent with the biggest hit, or nil"]] }),
  fn("LF.QueryFights(filter?)", "Finds fights in memory and SavedVariables.", [["array of Fight", "Memory first, then saved."]],
     { params: [["filter", "`zone`, `title`, `target`, `character` (substrings), `minDurationSec`, `minDPS`, `minSPS`, `sinceTimestamp`"]] }),
]},

{ id: "models", group: "Predictions", title: "Models", ns: "LF.Models.*", intro: "The models learn while you log. Target dummies (18,200 resistance) calibrate the resistance model; until then only relative toughness is known.", items: [
  row("GetReport()", "ModelReport", "Everything the models know, in one table."),
  fn("GetTargetEstimate(targetName)", "Predicted resistance and damage reduction of a target.", [["TargetEstimate", "See Data structures."], ["nil", "Nothing learned about that target yet."]]),
  row("GetAllTargetEstimates()", "array of TargetEstimate", "Most samples first."),
  fn("GetIncomingDR()", "Your own damage reduction against enemy hits.", [["{ armorMitigationPct, otherDRPct, totalDRPct, samples, otherStdPct }", "All percentages are 0..100. other = block, buffs and other DR. total = 1 − (1 − armor)(1 − other)."]]),
  fn("GetCritEstimate(abilityId?)", "Your crit chance and crit damage, from your hits.", [["{ critChance, critChanceStd, samples, critDamageMultiplier, critDamagePct, critDamageWeight }", "critChance is 0..1. Crit damage (e.g. 1.75 / 75) needs at least 3 crits and 3 non-crits on the same target; until then those fields are nil. If the ability has no data, crit chance falls back to the overall estimate."]],
     { params: [["abilityId", "nil for all abilities."]] }),
  fn("PredictHit(abilityId, targetName?)", "What the next hit of an ability should be.", [["{ nonCrit, crit, average, critChance, critMultiplier, rmse }", "rmse is the model error, in the same units as the hit."], ["nil", "Too little data for that ability."]]),
  fn("PredictIncomingHit(abilityId, damageType)", "How hard an enemy ability hits you with your current resistances.", [["meanHit, peakHit", "Expected and worst hit."], ["nil", "Ability never seen."]]),
  fn("GetTTK(unitTag?)", "Time to kill.", [["secondsRemaining, healthFraction", "Health is falling and there are enough samples."], ["nil, healthFraction", "Health is not falling, or fewer than 3 samples."], ["nil", "No data for that unit."]], { params: [["unitTag", "Default \"boss1\"."]] }),
  row("GetAllTTK()", "array of { unitTag, name, secondsRemaining, healthFraction }", "secondsRemaining can be nil."),
  fn("GetDPSForecast(secondsAhead?)", "Forecast DPS.", [["number", "Forecast."], ["nil", "No data yet."]], { params: [["secondsAhead", "Default 1."]] }),
  fn("PredictFightOutcome(fight?)", "How the fight will end if it continues like this.", [["{ currentDPS, elapsedSec, ttkSec, predictedDurationSec, predictedTotalDamage, predictedFinalDPS }", "The predicted fields and ttkSec are nil until TTK is known."], ["nil", "No fight."]]),
  row("IsReferenceTarget(targetName, targetType)", "boolean", "Whether the target calibrates the resistance model."),
  row("Reset()", "nothing", "Forgets everything learned."),
  row("Save() / Load()", "nothing", "Only when persistModels is on."),
  row("GetState()", "table", "Internal state, for advanced use."),
  sub("Building blocks (usable on their own)"),
  row("Models.NewRLS(nFeatures, lambda?, delta?)", "RLS", "Online linear regression. :Predict(x) → number, :Update(x, y) → error before the update, :GetRMSE() → number."),
  row("Models.NewKalman(q, r)", "Kalman", ":Update(z) → new estimate, :Std() → number or nil before the first update."),
  row("Models.NewWelford()", "Welford", "Running mean/variance. :Add(x), :Variance() (0 under 2 values), :Std()."),
  row("Models.NewBeta(a?, b?)", "Beta", "Defaults 1, 1. :Observe(success), :Mean() → 0..1, :Std(), :Count()."),
  row("Models.NewTrend(halfLifeSec?)", "Trend", "Default 30. :Add(time, value), :Fit() → slope, intercept (nil under 3 samples)."),
  row("Models.NewHolt(alpha?, beta?)", "Holt", "Defaults 0.3, 0.1. :Update(y), :Forecast(steps?) → number or nil."),
]},

{ id: "core", group: "Helpers", title: "Core and Util", ns: "LF.* · LF.Util.*", intro: "Small helpers the library uses everywhere. They are safe to use in your own add-on.", items: [

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c]));
const inl = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const isBad = (v) => /^(false|nil|""|\{\})/.test(v.trim());
const sigHtml = (s) => esc(s).replace(/(\w+\?)/g, '<span class="opt">$1</span>');
const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

function lua(code) {
  return esc(code)
    .replace(/(--[^\n]*)/g, '<span class="c">$1</span>')
    .replace(/(&quot;(?:(?!&quot;)[^\n])*?&quot;)/g, '<span class="s">$1</span>')
    .replace(/\b(local|function|end|if|then|elseif|else|for|in|do|while|return|break|nil|true|false|and|or|not)\b(?![^<]*<\/span>)/g, '<span class="k">$1</span>');
}

// ---------------------------------------------------------------------------
// Add-on examples. Each one is a complete file you can drop into an add-on folder.
// ---------------------------------------------------------------------------
const MANIFEST = (title, file, extra = "") =>
`## Title: ${title}
## Author: you
## Version: 1.0.0
## APIVersion: 101047 101048
## DependsOn: LibFights
${extra}
${file}`;

const EXAMPLES = [
{ id: "auto-logger", h: "Auto-logger", tag: "PC + console",
  p: "The smallest useful add-on. Starts logging when you enter combat, prints the fight summary when it ends, and stops logging again. It never stops logging that another add-on started.",
  uses: ["Start_Logging", "Stop_Logging", "Is_Logging", "RegisterCallback", "FIGHT_ENDED", "FightSummaryLines"],
  files: [
    { name: "MyFightLog/MyFightLog.addon", code: MANIFEST("My Fight Log", "MyFightLog.lua") },
    { name: "MyFightLog/MyFightLog.lua", code:
`local NAME = "MyFightLog"
local LF = LibFights
local weStarted = false   -- did this add-on turn logging on?

local function OnCombatState(_, inCombat)
  if inCombat and not Is_Logging() then
    weStarted = Start_Logging()   -- true, or false if already logging
  end
end

local function OnFightEnded(fight, reason)
  LF.PrintLines(LF.Report.FightSummaryLines(fight))

  -- stop shortly after, once LibFights has closed the fight
  zo_callLater(function()
    if weStarted and not IsUnitInCombat("player") and not LF.GetCurrentFight() then
      weStarted = false
      Stop_Logging()
    end
  end, 100)
end

local function OnLoaded(_, addonName)
  if addonName ~= NAME then return end
  EVENT_MANAGER:UnregisterForEvent(NAME, EVENT_ADD_ON_LOADED)
  EVENT_MANAGER:RegisterForEvent(NAME, EVENT_PLAYER_COMBAT_STATE, OnCombatState)

function renderExamples() {
  const index = `<nav class="ex-index" aria-label="Examples">${EXAMPLES.map((ex) => `<a href="#ex-${ex.id}">${esc(ex.h)}</a>`).join("")}</nav>`;
  const cards = EXAMPLES.map((ex, i) => `
    <article class="ex s-item" id="ex-${ex.id}">
      <div class="ex-head"><h3>${esc(ex.h)}</h3><span class="tag${ex.tag.startsWith("PC (") ? " pc" : ""}">${esc(ex.tag)}</span></div>
      <p class="ex-desc">${inl(ex.p)}</p>
      <div class="uses"><span>Uses</span>${ex.uses.map((u) => `<code>${esc(u)}</code>`).join("")}</div>
      ${ex.files.map((f, j) => `<div class="file"><div class="file-bar"><span class="fname">${esc(f.name)}</span><button class="copy" type="button" data-ex="${i}" data-file="${j}">Copy</button></div><pre>${f.name.endsWith(".addon") ? esc(f.code) : lua(f.code)}</pre></div>`).join("")}
      ${ex.note ? `<p class="ex-note">${inl(ex.note)}</p>` : ""}
    </article>`).join("");
  return `<p class="intro">Complete add-ons you can copy into <code>AddOns/</code>. Each one needs LibFights installed and lists it in <code>## DependsOn</code>. Slash commands work on PC only; on console, use a settings page like the one in <a href="#ex-settings-panel">Settings panel</a>.</p>${index}${cards}`;
}

function renderItem(it) {
  if (it.t === "sub") return `<h3 class="sub">${esc(it.title)}</h3>`;
  if (it.t === "prose") return it.html;
  if (it.t === "fn") {
    const id = curSec + "-" + slug(it.sig.split("(")[0]);
    const params = it.params ? `<dl class="params">${it.params.map(([n, t]) => `<dt>${esc(n)}</dt><dd>${inl(t)}</dd>`).join("")}</dl>` : "";
    const ret = `<div class="ret">${it.ret.map(([v, w]) => `<div class="ret-row"><div class="ret-val${isBad(v) ? " bad" : ""}">→ ${esc(v)}</div><div class="ret-when">${inl(w)}</div></div>`).join("")}</div>`;
    return `<div class="fn s-item" id="${id}"><div class="sig">${sigHtml(it.sig)}</div>${it.alias ? `<div class="alias">${esc(it.alias)}</div>` : ""}<p class="desc">${inl(it.desc)}</p>${params}${ret}${it.note ? `<p class="note">${inl(it.note)}</p>` : ""}</div>`;
  }
  if (it.t === "row") {
    return `<div class="crow s-item"><div class="sig">${sigHtml(it.sig)}</div><div class="rv${isBad(it.rv) ? " bad" : ""}">→ ${esc(it.rv)}</div><div class="tx">${inl(it.tx)}</div></div>`;
  }
  if (it.t === "tbl") {
    return `${it.title ? `<h3 class="sub">${esc(it.title)}</h3>` : ""}<div class="fields"><table><thead><tr>${it.cols.map((c) => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${it.rows.map((r) => `<tr class="s-item">${r.map((c, i) => `<td class="${i === 0 ? "f" : ""}">${inl(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  }
  if (it.t === "struct") {
    const rows = it.rows.map((r) => r[0].startsWith("#")
      ? `<tr><td class="grp" colspan="2">${esc(r[0].slice(1))}</td></tr>`
      : `<tr class="s-item"><td class="f">${esc(r[0])}</td><td>${inl(r[1] || "")}</td></tr>`).join("");
    return `<div class="struct s-block" id="type-${slug(it.name)}"><h4>${esc(it.name)} <span class="from">${esc(it.from)}</span></h4><div class="fields"><table><tbody>${rows}</tbody></table></div>${it.note ? `<p class="note">${inl(it.note)}</p>` : ""}</div>`;
  }
  return "";
}

// group consecutive "row" items into one compact list
function renderItems(items) {
  let html = "", buf = [];
  const flush = () => { if (buf.length) { html += `<div class="compact">${buf.join("")}</div>`; buf = []; } };
  for (const it of items) {
    if (it.t === "row") buf.push(renderItem(it)); else { flush(); html += renderItem(it); }
  }
  flush();
  return html;
}

let curSec = "";
function renderSection(s) {
  curSec = s.id;
  let body = "";
  if (s.special === "quick") {
    body = `<div class="qs">${QUICK.map((q) => `<div><h4>${esc(q.h)}</h4><p>${esc(q.p)}</p><pre>${lua(q.code.replace(/<k>|<\/k>/g, ""))}</pre></div>`).join("")}</div>`;
  } else if (s.special === "examples") {
    body = renderExamples();
  } else if (s.special === "conv") {
    body = `<dl class="conv">
      <dt>LF</dt><dd>The global table <code>LibFights</code>.</dd>
      <dt>f</dt><dd>A Fight object, e.g. <code>LibFights.GetLastFight()</code>.</dd>
      <dt>name?</dt><dd>A parameter with a question mark is optional.</dd>
      <dt>→ value</dt><dd>What the function returns. Several values are returned in that order, Lua style: <code>local ok, fight = Stop_Logging()</code>.</dd>
      <dt>→ <span class="chip bad">false / nil</span></dt><dd>Red rows are the failure or "nothing found" cases. Check for them before using the result.</dd>
      <dt>→ nothing</dt><dd>Returns no value (you get nil if you read it).</dd>
      <dt>ms / sec</dt><dd>Milliseconds and seconds. Fight times are game time from <code>GetGameTimeMilliseconds()</code>.</dd>
      <dt>0..1 / 0..100</dt><dd>0..1 is a fraction (0.52 = 52%). 0..100 is already a percentage. Fight stats use 0..1; the models use 0..100.</dd>
    </dl>`;
  } else {
    body = (s.intro ? `<p class="intro">${inl(s.intro)}</p>` : "") + renderItems(s.items);
  }
  return `<section class="sec" id="${s.id}" data-sec="${s.id}"><header><h2>${esc(s.title)}</h2>${s.ns ? `<span class="ns">${esc(s.ns)}</span>` : ""}</header>${body}</section>`;
}

const content = document.getElementById("content");
content.innerHTML = `
  <h1>LibFights API</h1>
  <p class="lede">Every public function in the LibFights library for Elder Scrolls Online, PC and console, and exactly what each one returns, including the false and nil cases.</p>
  <div class="rule-box"><strong>Nothing is logged until you call <code>Start_Logging()</code>.</strong> Lookups (abilities, sets, build, stats, search) work at any time.</div>
  ${SECTIONS.map(renderSection).join("")}
  <div class="empty" id="empty" hidden>No functions or fields match that search. Try a shorter word, like “shield” or “crit”.</div>`;

// sidebar
const toc = document.getElementById("toc");
let lastGroup = null, tocHtml = "";
for (const s of SECTIONS) {
  if (s.group !== lastGroup) { tocHtml += `<div class="group">${esc(s.group)}</div>`; lastGroup = s.group; }
  const n = s.special === "examples" ? EXAMPLES.length : s.items.filter((i) => i.t === "fn" || i.t === "row" || i.t === "struct").length;
  tocHtml += `<a href="#${s.id}" data-toc="${s.id}"><span>${esc(s.title)}</span><span class="n">${n || ""}</span></a>`;
}
toc.innerHTML = tocHtml;

const menuBtn = document.getElementById("menuBtn");
const side = document.getElementById("side");
menuBtn.addEventListener("click", () => {
  const open = side.classList.toggle("open");
  menuBtn.setAttribute("aria-expanded", String(open));
});
toc.addEventListener("click", (e) => { if (e.target.closest("a")) { side.classList.remove("open"); menuBtn.setAttribute("aria-expanded", "false"); } });

// active section highlight
const links = [...toc.querySelectorAll("a")];
const secs = [...document.querySelectorAll("section.sec")];
const io = new IntersectionObserver((entries) => {
  for (const en of entries) {
    if (en.isIntersecting) {
      links.forEach((a) => a.classList.toggle("active", a.dataset.toc === en.target.id));
    }
  }
}, { rootMargin: "-10% 0px -80% 0px" });
secs.forEach((s) => io.observe(s));

// search
const q = document.getElementById("q");
const count = document.getElementById("count");
const items = [...document.querySelectorAll(".s-item")];
items.forEach((el) => { el.dataset.text = el.textContent.toLowerCase(); el.dataset.html = el.innerHTML; });
const blocks = [...document.querySelectorAll(".s-block")];
blocks.forEach((b) => { b.dataset.name = b.querySelector("h4").textContent.toLowerCase(); });

function highlight(el, term) {
  // only touch text nodes, so markup stays valid
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const node of nodes) {
    const i = node.nodeValue.toLowerCase().indexOf(term);
    if (i < 0) continue;
    const range = document.createRange();
    range.setStart(node, i); range.setEnd(node, i + term.length);
    const m = document.createElement("mark");
    range.surroundContents(m);
  }
}

function runSearch() {
  const term = q.value.trim().toLowerCase();
  items.forEach((el) => { el.innerHTML = el.dataset.html; });
  if (!term) {
    items.forEach((el) => { el.hidden = false; });
    document.querySelectorAll(".compact, .fields, .struct, section.sec, h3.sub, .note, .intro, .qs, .conv, .ex-index").forEach((el) => { el.hidden = false; });
    links.forEach((a) => a.classList.remove("dim"));
    count.textContent = "";
    document.getElementById("empty").hidden = true;
    return;
  }
  let total = 0;
  items.forEach((el) => {
    const hit = el.dataset.text.includes(term);
    el.hidden = !hit;
    if (hit) { total++; highlight(el, term); }
  });
  // a data structure whose name matches shows all its fields
  blocks.forEach((b) => {
    if (b.dataset.name.includes(term)) b.querySelectorAll(".s-item").forEach((el) => { if (el.hidden) { el.hidden = false; total++; } });
  });
  document.querySelectorAll(".compact, .fields").forEach((box) => { box.hidden = !box.querySelector(".s-item:not([hidden])"); });
  document.querySelectorAll(".struct").forEach((b) => { b.hidden = !b.querySelector(".s-item:not([hidden])"); });
  document.querySelectorAll("h3.sub, .note, .intro, .qs, .conv, .ex-index").forEach((el) => { el.hidden = true; });
  secs.forEach((s) => {
    const any = !!s.querySelector(".s-item:not([hidden])");
    s.hidden = !any;
    const a = toc.querySelector(`[data-toc="${s.id}"]`);
    if (a) a.classList.toggle("dim", !any);
  });
  count.textContent = total === 1 ? "1 match" : `${total} matches`;
  document.getElementById("empty").hidden = total > 0;
}
// copy buttons on the examples (delegated: search re-renders the cards)
content.addEventListener("click", async (e) => {
  const btn = e.target.closest("button.copy");
  if (!btn) return;
  const code = EXAMPLES[+btn.dataset.ex].files[+btn.dataset.file].code;
  let ok = false;
  try { await navigator.clipboard.writeText(code); ok = true; } catch (err) { /* fall back below */ }
  if (!ok) {
    const ta = document.createElement("textarea");
    ta.value = code; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand("copy"); } catch (err) { ok = false; }
    ta.remove();
  }
  btn.textContent = ok ? "Copied" : "Select the code to copy";
  btn.classList.toggle("done", ok);
  setTimeout(() => { btn.textContent = "Copy"; btn.classList.remove("done"); }, 1600);
});

let timer;
q.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(runSearch, 120); });
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); }
  if (e.key === "Escape" && document.activeElement === q) { q.value = ""; runSearch(); }
});
</script>
